[package]
name = "relayune-desktop"
version = "0.3.33"
description = "Cross-platform desktop host for the end-to-end encrypted Relayune"
authors = ["Giraffetree"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "relayune_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
rand = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sys-locale = "0.3.2"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
toml = "0.9.12"
url = "2.5.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSAccessibilityConstants", "NSAccessibilityProtocols", "NSApplication", "NSButton", "NSCell", "NSColor", "NSControl", "NSFont", "NSFontDescriptor", "NSImage", "NSImageView", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSTextField", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSGeometry", "NSString", "NSProcessInfo"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55.0"

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test", "tray-icon", "image-png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[[test]]
name = "macos_menu_ax_probe"
path = "tests/macos_menu_ax_probe.rs"
harness = false
